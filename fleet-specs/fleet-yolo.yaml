# fleet-yolo.yaml
#
# Applies to any device labeled `inference=yolo` AND `purpose=mangey-moose`.
# Deploys: mediamtx (always-on) + model-init (one-shot) + yolo-infer.
#
# Apply:  flightctl apply -f fleet-yolo.yaml
# Verify: flightctl get fleet mangey-moose-yolo -o yaml

apiVersion: flightctl.io/v1alpha1
kind: Fleet
metadata:
  name: mangey-moose-yolo
  labels:
    purpose: mangey-moose
    inference: yolo
spec:
  selector:
    matchLabels:
      purpose: mangey-moose
      inference: yolo

  template:
    metadata:
      labels:
        purpose: mangey-moose
        inference: yolo
    spec:
      # OS image management is deliberately OFF for the demo.
      # The kickstart's `bootc switch` and the README build step referenced two
      # different image names (mangey-moose-base-image:latest vs mangey-moose:latest).
      # If this field doesn't match `bootc status` on the device *exactly*, the
      # agent will try to bootc-switch the OS on first reconcile and reboot the
      # Jetson mid-demo. Re-enable only after confirming the booted image ref:
      #   sudo bootc status --format json | jq -r '.status.booted.image.image.image'
      # os:
      #   image: quay.io/rh-ee-soanders/mangey-moose-base-image:latest

      # Applications: ordered conceptually but flightctl doesn't guarantee
      # start order — each app's own restart policy covers dependencies.
      applications:
        # --- MediaMTX: always-on RTSP/HLS/WHEP server --------------------
        - name: mediamtx
          inline:
            - path: compose.yaml
              content: |
                version: "3.8"
                services:
                  mediamtx:
                    image: quay.io/rh-ee-soanders/mangey-moose-mediamtx:v1.17.1
                    container_name: mangey-moose-mediamtx
                    network_mode: host
                    restart: unless-stopped

        # --- Model init: one-shot TRT engine export ----------------------
        - name: model-init
          inline:
            - path: compose.yaml
              content: |
                version: "3.8"
                services:
                  model-init:
                    image: quay.io/rh-ee-soanders/mangey-moose-model-init:v2
                    container_name: mangey-moose-model-init
                    restart: "no"
                    devices:
                      - nvidia.com/gpu=all
                    security_opt:
                      - label=disable
                    volumes:
                      - /var/lib/mangey-moose/models:/models:z

        # --- YOLO inference: the swappable workload ---------------------
        - name: yolo-inference
          inline:
            - path: compose.yaml
              content: |
                version: "3.8"
                services:
                  yolo-infer:
                    image: quay.io/rh-ee-soanders/mangey-moose-yolo-infer:v2
                    container_name: mangey-moose-yolo-infer
                    network_mode: host
                    restart: unless-stopped
                    devices:
                      - /dev/video0
                      - nvidia.com/gpu=all
                    group_add:
                      - video
                    security_opt:
                      - label=disable
                    volumes:
                      - /var/lib/mangey-moose/models:/models:ro,z
                    environment:
                      RTSP_URL: "rtsp://127.0.0.1:8554/infer"
                      SRC: "/dev/video0"
                      MODEL: "/models/yolo26n.engine"
                      W: "1280"
                      H: "720"
                      FPS: "10"
                      CAP_FOURCC: "YUYV"
                      BITRATE: "2500k"
                      ENCODER: "auto"
                      CAM_FAIL_THRESHOLD: "30"

  # Rollout policy: since you have one device, this is a formality. For a
  # real fleet, bump batch sizes and success thresholds.
  rolloutPolicy:
    deviceSelection:
      strategy: BatchSequence
      sequence:
        - selector:
            matchLabels:
              inference: yolo
          limit: 100%
    successThreshold: 100%