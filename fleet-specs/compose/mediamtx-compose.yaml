# MediaMTX RTSP/HLS/WHEP server — always on.
# Mirror of the mediamtx block in both fleet specs — keep byte-for-byte in sync.
version: "3.8"

services:
  mediamtx:
    image: quay.io/rh-ee-soanders/mangey-moose-mediamtx:v1.17.1
    container_name: mangey-moose-mediamtx
    network_mode: host
    restart: unless-stopped
    # No volumes, no devices, no GPU. Pure userspace RTSP server.