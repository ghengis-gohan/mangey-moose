# Model-init — one-shot TensorRT engine export.
# Exits after writing /models/yolov8n.engine and a signature sentinel.
# Same content as the model-init block in fleet-yolo.yaml — keep in sync.
version: "3.8"

services:
  model-init:
    image: quay.io/rh-ee-soanders/mangey-moose-model-init:v1
    container_name: mangey-moose-model-init
    restart: "no"
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    volumes:
      - /var/lib/mangey-moose/models:/models:z